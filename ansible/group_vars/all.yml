---
# ==============================================================================
# Shared variables for all hosts
# Override per-host in host_vars/ or per-group in group_vars/<group>.yml
# ==============================================================================

# ---------- Project paths -----------------------------------------------------
app_dir:       /home/ubuntu/sre-microservices
repo_url:      https://github.com/andronousss/containerized_Ecommerce_Microservices-main.git
repo_branch:   main
deploy_user:   ubuntu
project_subdir: ""

# ---------- Docker Compose files ----------------------------------------------
compose_file:       docker-compose.yml
swarm_compose_file: docker-stack.yml

# ---------- Docker Swarm ------------------------------------------------------
swarm_stack_name: sre-app

# ---------- Kubernetes --------------------------------------------------------
k8s_namespace:    microservices
k8s_manifests_dir: "{{ app_dir }}/SRE_4_pythonFAST_api/k8s"

# ---------- Service ports (must match docker-compose.yml) --------------------
frontend_port:   8080
prometheus_port: 9091
grafana_port:    52057
cadvisor_port:   8081

# ---------- Health-check retries ----------------------------------------------
health_retries: 15
health_delay:   10
kubectl_version: v1.30.0
