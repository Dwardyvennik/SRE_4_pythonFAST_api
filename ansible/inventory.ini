# ==============================================================================
# Ansible Inventory — SRE End-Term Project
# ==============================================================================
# After running: terraform apply
# Get the IP with: terraform output -raw instance_public_ip
# Paste it below to replace YOUR_EC2_PUBLIC_IP
# ==============================================================================

[sre_hosts]
sre-server ansible_host=YOUR_EC2_PUBLIC_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/sre-key
